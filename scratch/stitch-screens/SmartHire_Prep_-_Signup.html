<!-- Interactive Password Reveal Micro-script -->
<script>
    (function setupPasswordToggles() {
      const p1 = document.getElementById('password');
      const btn1 = document.getElementById('togglePassword');
      const eye1 = document.getElementById('eyeIcon1');
      const eyeOff1 = document.getElementById('eyeOffIcon1');

      if (btn1 && p1) {
        btn1.addEventListener('click', () => {
          const isPass = p1.type === 'password';
          p1.type = isPass ? 'text' : 'password';
          eye1.classList.toggle('hidden', isPass);
          eyeOff1.classList.toggle('hidden', !isPass);
        });
      }

      const p2 = document.getElementById('confirmPassword');
      const btn2 = document.getElementById('toggleConfirmPassword');
      const eye2 = document.getElementById('eyeIcon2');
      const eyeOff2 = document.getElementById('eyeOffIcon2');

      if (btn2 && p2) {
        btn2.addEventListener('click', () => {
          const isPass = p2.type === 'password';
          p2.type = isPass ? 'text' : 'password';
          eye2.classList.toggle('hidden', isPass);

    })();
