# Render Blueprint Deployment Specification (Optimized for 512MB RAM Free Tier)
# https://render.com/docs/blueprint-spec
services:
  # 1. Backend Web Service (Flask API)
  - type: web
    name: smarthire-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "gunicorn wsgi:app --workers 1 --threads 4 --worker-class gthread --max-requests 500 --max-requests-jitter 50 --timeout 120"
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "65536"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      # Optional: Groq or Gemini API keys
      # - key: GROQ_API_KEY
      #   sync: false

  # 2. Frontend Static Site (Vite React)
  - type: static_site
    name: smarthire-frontend
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smarthire-backend
          property: host
